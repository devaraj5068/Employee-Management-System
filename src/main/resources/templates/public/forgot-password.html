<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="bi bi-key-fill text-primary"></i>
            <span>Reset Password</span>
        </div>

        <p class="text-muted small text-center mb-4">Enter your registered email address and we will send you password reset instructions.</p>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label font-weight-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@company.com" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">
                <i class="bi bi-send me-2"></i> Send Reset Link
            </button>
        </form>

        <div class="mt-4 text-center">
            <a th:href="@{/login}" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
