<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mark Attendance')}"></head>
<body>
    <div id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layout :: navbar}"></nav>

            <div class="container-fluid p-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Mark Employee Attendance</h3>
                        <p class="text-muted mb-0">Manually record or edit attendance entry for an employee.</p>
                    </div>
                    <a th:href="@{/attendance/all}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Log</a>
                </div>

                <div class="card custom-table-card p-4" style="max-width: 700px;">
                    <form th:action="@{/attendance/mark}" th:object="${attendanceDto}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="employeeId" class="form-label font-weight-semibold">Select Employee *</label>
                                <select class="form-select" th:field="*{employeeId}" required>
                                    <option value="">-- Select Employee --</option>
                                    <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.fullName + ' (' + emp.employeeCode + ')'}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="attendanceDate" class="form-label font-weight-semibold">Attendance Date *</label>
                                <input type="date" class="form-control" th:field="*{attendanceDate}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('attendanceDate')}" th:errors="*{attendanceDate}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="checkInTime" class="form-label font-weight-semibold">Check-In Time</label>
                                <input type="time" class="form-control" th:field="*{checkInTime}">
                            </div>

                            <div class="col-md-6">
                                <label for="checkOutTime" class="form-label font-weight-semibold">Check-Out Time</label>
                                <input type="time" class="form-control" th:field="*{checkOutTime}">
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label font-weight-semibold">Status *</label>
                                <select class="form-select" th:field="*{status}" required>
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="workHours" class="form-label font-weight-semibold">Work Hours (Override)</label>
                                <input type="number" step="0.25" class="form-control" th:field="*{workHours}" placeholder="8.0">
                            </div>

                            <div class="col-md-12">
                                <label for="remarks" class="form-label font-weight-semibold">Remarks</label>
                                <input type="text" class="form-control" th:field="*{remarks}" placeholder="e.g. Approved leave / Duty trip">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                            <a th:href="@{/attendance/all}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-save me-1"></i> Save Attendance</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
