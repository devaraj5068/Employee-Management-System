<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Attendance Log')}"></head>
<body>
    <div id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layout :: navbar}"></nav>

            <div class="container-fluid p-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">My Attendance History</h3>
                        <p class="text-muted mb-0">View your daily check-in punches and work duration history.</p>
                    </div>
                </div>

                <div class="card custom-table-card">
                    <div class="table-responsive">
                        <table class="table custom-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Check-In Time</th>
                                    <th>Check-Out Time</th>
                                    <th>Work Hours</th>
                                    <th>Status</th>
                                    <th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="att : ${attendancePage.content}">
                                    <td class="fw-bold text-dark" th:text="${att.attendanceDate}">2026-08-05</td>
                                    <td th:text="${att.checkInTime != null ? att.checkInTime : '-'}">09:00</td>
                                    <td th:text="${att.checkOutTime != null ? att.checkOutTime : '-'}">17:30</td>
                                    <td class="fw-bold text-primary" th:text="${att.workHours != null ? att.workHours + ' hrs' : '0 hrs'}">8.5 hrs</td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${att.status.name() == 'PRESENT'} ? 'badge-active' : 'badge-on-leave'"
                                              th:text="${att.status}">PRESENT</span>
                                    </td>
                                    <td th:text="${att.remarks != null ? att.remarks : '-'}">On time</td>
                                </tr>
                                <tr th:if="${attendancePage.totalElements == 0}">
                                    <td colspan="6" class="text-center text-muted py-4">No attendance records recorded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
