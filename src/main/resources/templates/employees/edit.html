<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Employee')}"></head>
<body>
    <div id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layout :: navbar}"></nav>

            <div class="container-fluid p-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Edit Employee Profile</h3>
                        <p class="text-muted mb-0">Update employee details, role, department, or status.</p>
                    </div>
                    <a th:href="@{/employees}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to List</a>
                </div>

                <div class="card custom-table-card p-4">
                    <form th:action="@{/employees/edit/{id}(id=${employeeDto.id})}" th:object="${employeeDto}" method="post">
                        
                        <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">1. Personal Information</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="employeeCode" class="form-label font-weight-semibold">Employee Code</label>
                                <input type="text" class="form-control" th:field="*{employeeCode}" readonly>
                            </div>
                            <div class="col-md-4">
                                <label for="firstName" class="form-label font-weight-semibold">First Name *</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="lastName" class="form-label font-weight-semibold">Last Name *</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="email" class="form-label font-weight-semibold">Email Address *</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="mobileNumber" class="form-label font-weight-semibold">Mobile Number *</label>
                                <input type="text" class="form-control" th:field="*{mobileNumber}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="gender" class="form-label font-weight-semibold">Gender *</label>
                                <select class="form-select" th:field="*{gender}" required>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="dateOfBirth" class="form-label font-weight-semibold">Date of Birth</label>
                                <input type="date" class="form-control" th:field="*{dateOfBirth}">
                            </div>
                            <div class="col-md-8">
                                <label for="profilePictureUrl" class="form-label font-weight-semibold">Profile Picture Image URL</label>
                                <input type="text" class="form-control" th:field="*{profilePictureUrl}">
                            </div>
                        </div>

                        <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">2. Position & Employment</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="departmentId" class="form-label font-weight-semibold">Department *</label>
                                <select class="form-select" th:field="*{departmentId}" required>
                                    <option value="">-- Select Department --</option>
                                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="roleId" class="form-label font-weight-semibold">Role / Title *</label>
                                <select class="form-select" th:field="*{roleId}" required>
                                    <option value="">-- Select Role --</option>
                                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="joiningDate" class="form-label font-weight-semibold">Joining Date *</label>
                                <input type="date" class="form-control" th:field="*{joiningDate}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="employmentStatus" class="form-label font-weight-semibold">Employment Status</label>
                                <select class="form-select" th:field="*{employmentStatus}">
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                                </select>
                            </div>
                        </div>

                        <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">3. Address Information</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-12">
                                <label for="address" class="form-label font-weight-semibold">Street Address</label>
                                <input type="text" class="form-control" th:field="*{address}">
                            </div>
                            <div class="col-md-4">
                                <label for="city" class="form-label font-weight-semibold">City</label>
                                <input type="text" class="form-control" th:field="*{city}">
                            </div>
                            <div class="col-md-4">
                                <label for="state" class="form-label font-weight-semibold">State / Province</label>
                                <input type="text" class="form-control" th:field="*{state}">
                            </div>
                            <div class="col-md-4">
                                <label for="country" class="form-label font-weight-semibold">Country</label>
                                <input type="text" class="form-control" th:field="*{country}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a th:href="@{/employees}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-save me-1"></i> Update Employee</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
