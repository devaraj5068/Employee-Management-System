<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>
    <div id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layout :: navbar}"></nav>

            <div class="container-fluid p-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Change Security Password</h3>
                        <p class="text-muted mb-0">Update your login account password.</p>
                    </div>
                    <a th:href="@{/profile}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Profile</a>
                </div>

                <div class="card custom-table-card p-4" style="max-width: 500px;">
                    <form th:action="@{/profile/change-password}" th:object="${changePasswordDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label font-weight-semibold">Current Password *</label>
                            <input type="password" class="form-control" th:field="*{currentPassword}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label font-weight-semibold">New Password *</label>
                            <input type="password" class="form-control" th:field="*{newPassword}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label font-weight-semibold">Confirm New Password *</label>
                            <input type="password" class="form-control" th:field="*{confirmNewPassword}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                            <a th:href="@{/profile}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-shield-check me-1"></i> Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
