<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
    <div id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layout :: navbar}"></nav>

            <div class="container-fluid p-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">User Account & Employee Profile</h3>
                        <p class="text-muted mb-0">Manage your personal account settings and security credentials.</p>
                    </div>
                    <a th:href="@{/profile/change-password}" class="btn btn-outline-primary"><i class="bi bi-key me-1"></i> Change Password</a>
                </div>

                <div class="card custom-table-card p-4" style="max-width: 800px;">
                    <div class="d-flex align-items-center gap-4 pb-4 border-bottom mb-4">
                        <i class="bi bi-person-circle fs-1 text-primary"></i>
                        <div>
                            <h4 class="fw-bold mb-1" th:text="${user.username}">Username</h4>
                            <p class="text-muted mb-0" th:text="${user.email}">user@email.com</p>
                        </div>
                    </div>

                    <div th:if="${employee != null}" class="row g-4">
                        <div class="col-md-6">
                            <h6 class="fw-bold text-primary mb-3">Employee Record Info</h6>
                            <table class="table table-borderless table-sm">
                                <tr><th class="text-muted">Code:</th><td class="fw-bold text-primary" th:text="${employee.employeeCode}">EMP001</td></tr>
                                <tr><th class="text-muted">Full Name:</th><td class="fw-semibold" th:text="${employee.fullName}">Name</td></tr>
                                <tr><th class="text-muted">Mobile:</th><td th:text="${employee.mobileNumber}">Mobile</td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6 class="fw-bold text-primary mb-3">Position Details</h6>
                            <table class="table table-borderless table-sm">
                                <tr><th class="text-muted">Department:</th><td th:text="${employee.departmentName}">Dept</td></tr>
                                <tr><th class="text-muted">Role:</th><td th:text="${employee.roleName}">Role</td></tr>
                                <tr><th class="text-muted">Joined:</th><td th:text="${employee.joiningDate}">Date</td></tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
