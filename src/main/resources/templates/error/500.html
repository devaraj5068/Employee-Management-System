<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Server Error')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-4">
    <div class="text-center" style="max-width: 480px;">
        <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3"></i>
        <h1 class="fw-bold text-dark display-4">500</h1>
        <h4 class="fw-bold text-dark mb-2">Internal Server Error</h4>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'An unexpected error occurred while processing your request.'}">Server Error.</p>
        <a th:href="@{/dashboard}" class="btn btn-primary-custom px-4"><i class="bi bi-house me-1"></i> Return to Dashboard</a>
    </div>
</body>
</html>
