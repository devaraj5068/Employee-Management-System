<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page Not Found')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-4">
    <div class="text-center" style="max-width: 480px;">
        <i class="bi bi-question-circle-fill text-warning display-1 mb-3"></i>
        <h1 class="fw-bold text-dark display-4">404</h1>
        <h4 class="fw-bold text-dark mb-2">Page Not Found</h4>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'The page or resource you requested could not be found.'}">Resource not found.</p>
        <a th:href="@{/dashboard}" class="btn btn-primary-custom px-4"><i class="bi bi-house me-1"></i> Return to Dashboard</a>
    </div>
</body>
</html>
