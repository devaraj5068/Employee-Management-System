<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System Roles')}"></head>
<body>
    <div id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layout :: navbar}"></nav>

            <div class="container-fluid p-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Role Management</h3>
                        <p class="text-muted mb-0">Define system access security roles and job titles.</p>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Add Role Form -->
                    <div class="col-lg-4">
                        <div class="card custom-table-card p-4">
                            <h5 class="fw-bold text-primary mb-3"><i class="bi bi-shield-plus me-2"></i>Add Role</h5>
                            <form th:action="@{/roles/add}" th:object="${roleDto}" method="post">
                                <div class="mb-3">
                                    <label class="form-label font-weight-semibold">Role Name *</label>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. ROLE_MANAGER" required>
                                    <div class="form-text small">Prefixed with ROLE_ automatically if missing.</div>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label font-weight-semibold">Description</label>
                                    <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Role permissions description..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary-custom w-100"><i class="bi bi-save me-1"></i> Save Role</button>
                            </form>
                        </div>
                    </div>

                    <!-- Roles List -->
                    <div class="col-lg-8">
                        <div class="card custom-table-card">
                            <div class="table-responsive">
                                <table class="table custom-table">
                                    <thead>
                                        <tr>
                                            <th>Role Name</th>
                                            <th>Description</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="r : ${roles}">
                                            <td class="fw-bold text-primary">
                                                <span class="badge bg-primary text-white fs-6" th:text="${r.name}">ROLE_ADMIN</span>
                                            </td>
                                            <td th:text="${r.description != null ? r.description : '-'}">Description</td>
                                            <td>
                                                <div class="d-flex gap-1">
                                                    <a th:href="@{/roles/edit/{id}(id=${r.id})}" class="btn btn-sm btn-light border" title="Edit"><i class="bi bi-pencil"></i></a>
                                                    <form th:action="@{/roles/delete/{id}(id=${r.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this role?');">
                                                        <button type="submit" class="btn btn-sm btn-light border text-danger" title="Delete"><i class="bi bi-trash"></i></button>
                                                    </form>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(roles)}">
                                            <td colspan="3" class="text-center text-muted py-4">No roles defined.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
