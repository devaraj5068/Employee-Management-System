<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pending Leave Approvals')}"></head>
<body>
    <div id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <nav th:replace="~{fragments/layout :: navbar}"></nav>

            <div class="container-fluid p-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Pending Leave Approvals</h3>
                        <p class="text-muted mb-0">Review and approve or reject employee leave applications.</p>
                    </div>
                </div>

                <div class="card custom-table-card">
                    <div class="table-responsive">
                        <table class="table custom-table">
                            <thead>
                                <tr>
                                    <th>Applicant</th>
                                    <th>Department</th>
                                    <th>Type</th>
                                    <th>Dates</th>
                                    <th>Days</th>
                                    <th>Reason</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="l : ${leavePage.content}">
                                    <td>
                                        <div class="fw-bold text-primary" th:text="${l.employeeName}">Alex Johnson</div>
                                        <div class="text-muted small" th:text="${l.employeeCode}">EMP004</div>
                                    </td>
                                    <td th:text="${l.departmentName != null ? l.departmentName : '-'}">IT</td>
                                    <td class="fw-semibold" th:text="${l.leaveType}">CASUAL</td>
                                    <td>
                                        <span th:text="${l.startDate}">2026-08-10</span> to <span th:text="${l.endDate}">2026-08-12</span>
                                    </td>
                                    <td class="fw-bold text-dark" th:text="${l.numberOfDays}">3</td>
                                    <td th:text="${l.reason}">Family reason</td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <form th:action="@{/leave/approve/{id}(id=${l.id})}" method="post">
                                                <button type="submit" class="btn btn-sm btn-success px-3"><i class="bi bi-check-lg me-1"></i> Approve</button>
                                            </form>
                                            <form th:action="@{/leave/reject/{id}(id=${l.id})}" method="post">
                                                <button type="submit" class="btn btn-sm btn-danger px-3"><i class="bi bi-x-lg me-1"></i> Reject</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${leavePage.totalElements == 0}">
                                    <td colspan="7" class="text-center text-muted py-4">No pending leave applications requiring approval.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
