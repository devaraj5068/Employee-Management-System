{% extends 'base.html' %}

{% block title %}404 Page Not Found | {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5 max-w-600 mx-auto">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted lead mb-4">The ticket, document, or route you are looking for does not exist or may have been archived.</p>
    <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2">Return to Home</a>
  </div>
</div>
{% endblock %}
