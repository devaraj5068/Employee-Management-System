{% extends 'base.html' %}

{% block title %}Reset Password | {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
        <h3 class="fw-bold mb-2 text-center text-primary">Set New Password</h3>
        <p class="text-muted small text-center mb-4">Enter the OTP sent to your account and choose a new password.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">Reset OTP Code</label>
            {{ form.otp_code }}
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">New Password</label>
            {{ form.new_password }}
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold">Confirm Password</label>
            {{ form.confirm_password }}
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Save New Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
