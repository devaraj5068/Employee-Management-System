{% extends 'base.html' %}

{% block title %}Sign In | {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <span class="brand-icon mx-auto mb-2" style="width: 54px; height: 54px; font-size: 1.7rem;"><i class="bi bi-shield-lock"></i></span>
          <h3 class="fw-bold tracking-tight">Welcome Back</h3>
          <p class="text-muted small">Sign in to your ResolveNow account</p>
        </div>

        <form method="post" action="{% url 'accounts:login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
              <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username or email" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-semibold small mb-0">Password</label>
              <a href="{% url 'accounts:forgot_password' %}" class="small text-decoration-none">Forgot Password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <!-- Demo Accounts Helper Buttons for Easy Academic Presentation -->
        <div class="bg-light p-3 rounded-3 mt-2 border">
          <div class="small fw-bold text-muted text-uppercase mb-2" style="font-size: 0.72rem;">
            <i class="bi bi-lightning-fill text-warning"></i> Demo Quick Login Buttons:
          </div>
          <div class="d-flex flex-column gap-2">
            <button type="button" class="btn btn-sm btn-outline-danger text-start d-flex justify-content-between align-items-center" onclick="fillDemo('admin', 'admin123')">
              <span><i class="bi bi-shield-shaded me-1"></i> Admin</span>
              <small class="text-muted">admin / admin123</small>
            </button>
            <button type="button" class="btn btn-sm btn-outline-warning text-dark text-start d-flex justify-content-between align-items-center" onclick="fillDemo('officer_water', 'staff123')">
              <span><i class="bi bi-person-badge me-1"></i> Field Officer</span>
              <small class="text-muted">officer_water / staff123</small>
            </button>
            <button type="button" class="btn btn-sm btn-outline-info text-dark text-start d-flex justify-content-between align-items-center" onclick="fillDemo('citizen_john', 'citizen123')">
              <span><i class="bi bi-person me-1"></i> Citizen</span>
              <small class="text-muted">citizen_john / citizen123</small>
            </button>
          </div>
        </div>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">Don't have an account yet? <a href="{% url 'accounts:register' %}" class="fw-bold text-primary text-decoration-none">Register as Citizen</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function fillDemo(u, p) {
  document.getElementById('id_username').value = u;
  document.getElementById('id_password').value = p;
}
</script>
{% endblock %}
