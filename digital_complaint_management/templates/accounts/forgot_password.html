{% extends 'base.html' %}

{% block title %}Forgot Password | {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white text-center">
        <span class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;"><i class="bi bi-question-circle"></i></span>
        <h3 class="fw-bold mb-2">Forgot Password</h3>
        <p class="text-muted small mb-4">Enter your registered email address to receive a secure password reset code.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label class="form-label small fw-semibold">Email Address</label>
            {{ form.email }}
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">Send Reset Code</button>
        </form>

        <div class="pt-3 border-top">
          <a href="{% url 'accounts:login' %}" class="small text-decoration-none">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
